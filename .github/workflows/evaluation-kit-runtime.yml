name: Riverbraid Mechanical Reproduction Profile v0.1

on:
  workflow_dispatch:
    inputs:
      core_commit:
        description: Exact 40-hex Riverbraid-Core commit to reproduce
        required: true
        type: string

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout evaluator source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.11.0'

      - name: Verify result contract fixtures
        run: node verify-result-contract.mjs

      - name: Run scoped mechanical reproduction
        env:
          CORE_COMMIT: ${{ inputs.core_commit }}
        run: |
          node run-mechanical-reproduction.mjs             --subject-commit "$CORE_COMMIT"             --out "$RUNNER_TEMP/riverbraid-mechanical-result.json"
          cat "$RUNNER_TEMP/riverbraid-mechanical-result.json"
