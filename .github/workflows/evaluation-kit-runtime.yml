name: Riverbraid Evaluation Kit Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-kit:
    name: Verify Evaluation Kit
    runs-on: ubuntu-24.04
    steps:
      - name: Observe Docker base image identity
        id: base-image
        run: |
          set -euo pipefail
          base_image="node:20.11.0-bookworm-slim"
          digest="$(docker buildx imagetools inspect "$base_image" | awk '/^Digest:/ {print $2; exit}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "FAIL_CLOSED: unable to resolve attributable Docker base image digest"
            echo "base_image=$base_image"
            echo "observed_digest=$digest"
            exit 1
          fi
          echo "BASE_IMAGE_NAME=$base_image"
          echo "BASE_IMAGE_RESOLVED_DIGEST=$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify environment-lock base image identity
        run: |
          set -euo pipefail
          expected_name="node:20.11.0-bookworm-slim"
          locked_name="$(jq -r '.docker_base_image.name' environment.lock.json)"
          locked_digest="$(jq -r '.docker_base_image.digest' environment.lock.json)"
          observed_digest="${{ steps.base-image.outputs.digest }}"

          if [ "$locked_name" != "$expected_name" ]; then
            echo "FAIL_CLOSED: environment-lock base image name differs from observed workflow subject"
            echo "expected=$expected_name"
            echo "actual=$locked_name"
            exit 1
          fi

          if [ "$locked_digest" != "$observed_digest" ]; then
            echo "FAIL_CLOSED: Docker base-image tag no longer resolves to the locked digest"
            echo "locked=$locked_digest"
            echo "observed=$observed_digest"
            exit 1
          fi

          if ! grep -Fq "@$locked_digest" Dockerfile; then
            echo "FAIL_CLOSED: Dockerfile is not bound to the environment-lock digest"
            exit 1
          fi

          echo "BASE_IMAGE_IDENTITY_LOCK_MATCH"

      - name: Verify required files exist
        run: |
          set -euo pipefail
          files=(
            "README.md"
            "START_HERE.md"
            "ONE_PAGE_SYSTEM_MAP.md"
            "CLAIM_LEVELS.md"
            "claim-ceiling.json"
            "EVALUATOR_DECISION_TREE.md"
            "RISK_PROFILE_MATRIX.md"
            "MATURITY_LADDER.md"
            "REPRODUCE_RIVERBRAID_v0.1.0-governance-floor.md"
            "verified-repo-registry.json"
            "expected-results.json"
            "environment.lock.json"
            "Dockerfile"
            "command-policy.sh"
            "run-verification.sh"
            "tests/command-policy-negative.sh"
            "reproduce.ps1"
            "reproduce.sh"
            ".gitattributes"
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "FAIL: Required file missing: $file"
              exit 1
            fi
          done

          echo "All required files present"

      - name: Validate verified-repo-registry.json
        run: |
          set -euo pipefail
          jq empty verified-repo-registry.json

          registry_count="$(jq 'length' verified-repo-registry.json)"
          if [ "$registry_count" -ne 30 ]; then
            echo "FAIL: registry must contain exactly 30 entries. Found: $registry_count"
            exit 1
          fi

          missing_fields="$(jq -r '.[] | select((has("name") | not) or (has("url") | not) or (has("commit") | not) or (has("verify_command") | not)) | .name // "UNKNOWN_ENTRY"' verified-repo-registry.json)"
          if [ -n "$missing_fields" ]; then
            echo "FAIL: registry entries missing required fields"
            echo "$missing_fields"
            exit 1
          fi

          unpinned_count="$(jq '[.[] | select(.commit == "UNPINNED" or .commit == "" or .commit == null)] | length' verified-repo-registry.json)"
          if [ "$unpinned_count" -ne 0 ]; then
            echo "FAIL_CLOSED: registry contains unpinned commits"
            jq -r '.[] | select(.commit == "UNPINNED" or .commit == "" or .commit == null) | .name' verified-repo-registry.json
            exit 1
          fi

          invalid_commits="$(jq -r '.[] | select((.commit | type != "string") or ((.commit | test("^[0-9a-f]{40}$")) | not)) | .name' verified-repo-registry.json)"
          if [ -n "$invalid_commits" ]; then
            echo "FAIL: invalid commit format"
            echo "$invalid_commits"
            exit 1
          fi

          echo "Registry validated: 30 entries, all pinned, all valid"

      - name: Verify unsupported commands fail closed
        run: bash tests/command-policy-negative.sh

      - name: Build Docker image
        run: docker build -t riverbraid-evaluator .

      - name: Run evaluation kit
        id: run-kit
        run: |
          set -euo pipefail
          docker run --rm riverbraid-evaluator | tee kit-output.txt
          if grep -q "REPRODUCTION_MATCH" kit-output.txt; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "FAIL_CLOSED: reproduction output did not contain REPRODUCTION_MATCH"
            exit 1
          fi

      - name: Generate verification success summary
        if: success()
        run: |
          cat > verification-summary.json <<EOF
          {
            "status": "GITHUB_ACTIONS_RUNTIME_VERIFICATION_PASS",
            "repository": "Riverbraid/Riverbraid-Evaluation-Kit",
            "runtime_claim": "EXECUTED_IN_GITHUB_ACTIONS",
            "docker_claim": "BASE_IMAGE_DIGEST_PINNED_AND_VERIFIED_IN_GITHUB_ACTIONS",
            "command_policy_negative_test": "ALLOWLIST_NEGATIVE_TEST_PASS",
            "base_image_locked_digest": "${{ steps.base-image.outputs.digest }}",
            "verification_surface": "ubuntu-24.04 GitHub Actions",
            "local_windows_claim": "NOT_REQUIRED"
          }
          EOF
          jq . verification-summary.json

      - name: Generate verification failure summary
        if: failure()
        run: |
          cat > verification-summary.json <<'EOF'
          {
            "status": "GITHUB_ACTIONS_RUNTIME_VERIFICATION_FAIL",
            "repository": "Riverbraid/Riverbraid-Evaluation-Kit"
          }
          EOF
          jq . verification-summary.json
